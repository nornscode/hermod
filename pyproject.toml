[project]
name = "hermod"
version = "0.1.0"
description = "GitHub PR shepherd agent, a Norns durable execution reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "norns-sdk>=0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "slack-sdk>=3.33",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
hermod-server = "hermod.server:main"
hermod-worker = "hermod.worker:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
